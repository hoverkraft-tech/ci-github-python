name: Internal - Common Continuous Integration tasks
"on":
  workflow_call: null
permissions: {}
jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@d606f77fad305ef07dfde3db5270f5e324019c97
    permissions:
      contents: read
      statuses: write
      issues: write
      packages: read
      pull-requests: write
      actions: read
      security-events: write
    with:
      linter-env: |
        VALIDATE_GO=false
        VALIDATE_GO_MODULES=false
        VALIDATE_PYTHON_BLACK=false
        VALIDATE_PYTHON_RUFF=false
        VALIDATE_PYTHON_MYPY=false
        VALIDATE_PYTHON_PYLINT=false
        VALIDATE_PYTHON_ISORT=false
  test:
    uses: $/.github/workflows/__test-workflow-continuous-integration.yml
    permissions:
      contents: read
      id-token: write
  test-action-setup-python:
    uses: $/.github/workflows/__test-action-setup-python.yml
    permissions:
      contents: read
  test-action-lint:
    uses: $/.github/workflows/__test-action-lint.yml
    permissions:
      contents: read
  test-action-test:
    uses: $/.github/workflows/__test-action-test.yml
    permissions:
      contents: read
  test-action-audit:
    uses: $/.github/workflows/__test-action-audit.yml
    permissions:
      contents: read
  test-action-package-test:
    uses: $/.github/workflows/__test-action-package-test.yml
    permissions:
      contents: read
