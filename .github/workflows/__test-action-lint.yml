name: Internal - Test lint action
"on":
  workflow_call: null
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.check.outputs.report-artifact-id }}
    steps:
      - name: Arrange - Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert - Action contract tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
        with:
          command: test:ci
          arguments: '["actions/lint/action.test.cjs"]'
          coverage: none
          comment: "false"
      - name: Arrange - Install the project runtime and dependencies
        uses: $/actions/setup-python
        with:
          working-directory: tests/python-project
      - name: Act - Run the default lint checks
        uses: $/actions/lint
        with:
          working-directory: tests/python-project
        id: check
  verify:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Assert - Download retained lint reports
        uses: hoverkraft-tech/ci-github-common/actions/download-artifact@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
        with:
          artifact-ids: ${{ needs.lint.outputs.artifact-id }}
          path: ${{ runner.temp }}/retained-reports
      - name: Assert - Native reports and validation result are retained
        shell: bash
        run: |
          test -f "$REPORT_DIRECTORY/result.json"
          test -s "$REPORT_DIRECTORY/reports/ruff.sarif"
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/retained-reports
