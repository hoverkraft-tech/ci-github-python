---
name: Internal - Test test action
"on":
  workflow_call: null
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.failed-test.outputs.report-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        name: Arrange - Check out the repository
      - name: Assert - Action contract tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@11636b817040a2a7d61b389c28fa1b401c37a2fa # unified reports (PR #624, unreleased)
        with:
          command: test:ci
          arguments: '["actions/test/action.test.cjs"]'
          coverage: "false"
      - uses: $/actions/setup-python
        with:
          working-directory: tests/python-project
        name: Arrange - Install dependencies
      - id: test
        uses: $/actions/test
        with:
          working-directory: tests/python-project
        name: Act - Run default tests
      - id: failed-test
        continue-on-error: true
        uses: $/actions/test
        with:
          working-directory: tests/python-project
          command: |-
            printf '%s' '<testsuites tests="1" failures="1"><testsuite name="failure" tests="1" failures="1"><testcase name="fails"><failure message="expected">failure</failure></testcase></testsuite></testsuites>' > junit.xml
            exit 17
          coverage: "false"
        name: Act - Run a failing test command
      - name: Assert failures and reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUCCESS_ARTIFACT: ${{ steps.test.outputs.report-artifact-id }}
          FAILURE_ARTIFACT: ${{ steps.failed-test.outputs.report-artifact-id }}
          TEST_OUTCOME: ${{ steps.failed-test.outcome }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(process.env.TEST_OUTCOME, 'failure');
            assert.ok(process.env.SUCCESS_ARTIFACT, 'Successful tests retain reports');
            assert.ok(process.env.FAILURE_ARTIFACT, 'Failed tests retain reports');
            assert.notEqual(process.env.SUCCESS_ARTIFACT, process.env.FAILURE_ARTIFACT);
  verify:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: hoverkraft-tech/ci-github-common/actions/download-artifact@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
        with:
          artifact-ids: ${{ needs.test.outputs.artifact-id }}
          path: ${{ runner.temp }}/failed-reports
      - name: Verify retained failure report
        shell: bash
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/failed-reports
        run: |
          test -f "$REPORT_DIRECTORY/ci-report.json"
          grep -rq 'message="expected"' "$REPORT_DIRECTORY/reports"
