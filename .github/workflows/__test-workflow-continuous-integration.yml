---
name: Internal - Test continuous integration workflow
"on":
  workflow_call: null
permissions: {}
jobs:
  configuration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert - Workflow configuration tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@98d91b1cc347efc64cd5fb20bc0ebc076acad114 # 3.1.0
        with:
          command: test:ci
          arguments: '["tests/config.test.cjs"]'
          coverage: ""
          comment: "false"
  fixture:
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: tests/python-project
      test: '{"coverage":"github-code-quality","report-group":"fixture"}'
      python-versions: '["3.13", "3.15"]'
      dependency-review: false
      package: '{"tests": "python -I -c \"from ci_python_fixture import add; assert add(2, 3) == 5\""}'
  checks-disabled:
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
    with:
      checks: false
      working-directory: must-not-exist
      lint: exit 99
      test: exit 99

  collect-native-coverage:
    name: Verify coverage from the primary runtime
    needs: fixture
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@d52648f1645f1318908149af3f35b71b897ca566 # coverage support (PR #683, unreleased)
    permissions:
      contents: read
      pull-requests: write
    with:
      comment: false
      concurrency-group: test-native-python-${{ github.run_id }}-${{ github.run_attempt }}
      job-results: ${{ toJSON(needs) }}
      coverage-reports: '[{"job":"fixture","label":"tests/python-project"}]'
