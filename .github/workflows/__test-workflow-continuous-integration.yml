---
name: Internal - Test continuous integration workflow
"on":
  workflow_call: null
permissions: {}
jobs:
  configuration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert - Workflow configuration tests pass
        uses: hoverkraft-tech/ci-github-nodejs/actions/test@11636b817040a2a7d61b389c28fa1b401c37a2fa # unified reports (PR #624, unreleased)
        with:
          command: test:ci
          arguments: '["tests/config.test.cjs"]'
          coverage: "false"
  fixture:
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: tests/python-project
      test: '{"coverage":true}'
      python-versions: '["3.13", "3.15"]'
      dependency-review: false
      package: '{"tests": "python -I -c \"from ci_python_fixture import add; assert add(2, 3) == 5\""}'
  checks-disabled:
    uses: $/.github/workflows/continuous-integration.yml
    permissions:
      contents: read
      id-token: write
    with:
      checks: false
      working-directory: must-not-exist
      lint: exit 99
      test: exit 99

  collect-native-coverage:
    name: Verify coverage from the primary runtime
    needs: fixture
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
    permissions:
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
    with:
      comment: false
      job-results: ${{ toJSON(needs) }}
