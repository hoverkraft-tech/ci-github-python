# Run opinionated checks with project-owned configuration.
#
# ### Quick start
#
# ```yaml
# name: CI
# on: [push, pull_request]
# permissions: {}
# jobs:
#   python:
#     uses: hoverkraft-tech/ci-github-python/.github/workflows/continuous-integration.yml@main
#     permissions:
#       actions: read
#       contents: read
#     with:
#       working-directory: .
#       python-versions: '["3.13", "3.15"]'
# ```
#
# An empty versions input uses project detection once. The highest configured version is
# the primary version: lint, audit and package checks run there, and only
# that version contributes coverage. Tests run on every entry with fail-fast disabled.
# Duplicate, malformed and non-string versions are rejected. `runs-on` is a JSON
# array of Linux labels and applies to every job, including configuration.
#
# `checks: false` disables every check. Set `lint` or `test` to the string
# `"false"`, `"null"` or an empty string to disable that check. A command string or
# JSON object with `command` replaces its default. Commands are trusted Bash
# programs and run unchanged with failure propagation; do not populate them from
# untrusted pull request text. Unknown options fail before any project execution.
#
# Dependency review runs only on pull requests. Disable it with
# `dependency-review: false` when unavailable for the caller repository.
# `audit: false` disables vulnerability scanning. Audit results depend on the
# current vulnerability database and require network access.
#
# ### Python projects
#
# Use uv projects with committed `pyproject.toml`, `uv.lock` and preferably
# `.python-version`. Explicit `python-version` takes precedence; otherwise
# uv selects from `.python-version` and `requires-python`. Setup runs
# `uv sync --locked`: missing or stale locks fail instead of being rewritten.
# It installs uv's default dependency groups; optional extras require caller configuration.
# Configure `[tool.uv].default-groups` when additional groups are needed.
#
# Declare Ruff, Black, mypy, pytest and pytest-cov in those default groups.
# Ruff reports SARIF, Black checks formatting, and mypy uses the project's
# configuration. All three lint checks execute even after a failure.
# Configure coverage sources under `[tool.coverage.run]` to avoid measuring
# unrelated code. The [fixture](../../tests/python-project/pyproject.toml)
# shows a typed `src/` package and project-owned tool configuration.
#
# The audit action exports the locked production environment with hashes,
# then runs pip-audit. Development groups and the project itself are excluded.
# Registry dependencies with hashes are the supported audit input; direct
# VCS or editable dependencies may need a project-specific audit workflow.
#
# Distribution checks are opt-in:
#
# ```yaml
# with:
#   package: '{"tests":"python -I -c \"import my_package\""}'
# ```
#
# The action builds with `uv build --no-sources`, installs the wheel and
# sdist independently into temporary venvs, checks dependencies, and runs
# the supplied commands outside the source checkout. `PACKAGE_NAME`,
# `PACKAGE_VERSION` and the consumer venv's `PATH` are available. Pin the
# build backend in `build-system.requires` for reproducible builds.
# Build backends execute code; Python has no general equivalent to npm's
# `ignore-scripts` switch. The action does not publish to PyPI.
#
# ### Reports and coverage
#
# Every runtime retains detailed test results. The highest configured version runs
# lint and coverage once. Default pytest commands disable coverage instrumentation
# on other versions. Custom commands receive CI_TEST_COVERAGE and CI_REPORTS_DIR.
# Outputs are validated by the test action, including after command failure.
#
# Call ci-github-common's ci-reports.yml once after all producer jobs with
# job-results: toJSON(needs). No report plans or artifact IDs need forwarding.
# Producer calls need actions: read and contents: read. The reporting caller grants
# actions: read, contents: read, pull-requests: write, code-quality: write,
# id-token: write and security-events: write; internal publisher jobs narrow these.
# Lint and test results default to annotations. Coverage defaults to GitHub when
# available, then a comment or summary. Choose destinations using lint-reporters,
# test-results-reporters and test-coverage-reporters on that single reporting call.
#
name: Python Continuous Integration
"on":
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of Linux runner labels for all jobs.
        type: string
        default: '["ubuntu-latest"]'
      checks:
        description: Enable all checks, including distribution checks.
        type: boolean
        default: true
      working-directory:
        description: One project directory inside the checkout. Use a caller matrix for multiple projects.
        type: string
        default: .
      python-versions:
        description:
          JSON array of Python versions. The highest configured version runs lint, audit, package checks and coverage; every version retains
          test results. Empty uses project detection once.
        type: string
        default: ""
      lint:
        description: true for defaults, a Bash command, or JSON options (command, lint-results). false, null or empty disables lint.
        type: string
        default: "true"
      test:
        description:
          true for defaults, a Bash command, or JSON options (command, coverage, test-results, test-coverage). false, null or empty disables
          tests.
        type: string
        default: "true"
      audit:
        description: Check production dependencies for known vulnerabilities.
        type: boolean
        default: true
      dependency-review:
        description: Review dependency changes on pull requests. Requires GitHub dependency review availability.
        type: boolean
        default: true
      package:
        description:
          false disables distribution tests. true builds and installs wheel and sdist. A JSON object with tests supplies consumer smoke commands.
          Does not publish packages.
        type: string
        default: "false"
      uv-version:
        description: Pinned uv release.
        type: string
        default: 0.13.9
permissions: {}
jobs:
  configuration:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions: {}
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      primary-version: ${{ steps.config.outputs.primary-version }}
      lint: ${{ steps.config.outputs.lint }}
      test: ${{ steps.config.outputs.test }}
      package-enabled: ${{ steps.config.outputs.package-enabled }}
      package-tests: ${{ steps.config.outputs.package-tests }}
    steps:
      - id: config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSIONS: ${{ inputs.python-versions }}
          LINT: ${{ inputs.lint }}
          TEST: ${{ inputs.test }}
          PACKAGE: ${{ inputs.package }}
          DIRECTORY: ${{ inputs.working-directory }}
          CHECKS: ${{ inputs.checks }}
        with:
          script: |
            const versions = process.env.VERSIONS.trim() ? JSON.parse(process.env.VERSIONS) : [''];
            if (!Array.isArray(versions) || !versions.length || versions.length > 20 ||
                versions.some(version => typeof version !== 'string' || (version && !/^\d+\.\d+(?:\.\d+)?$/.test(version))) ||
                new Set(versions).size !== versions.length) {
              throw new Error('versions must be a nonempty JSON array of unique numeric version strings.');
            }
            function options(name, input, defaults) {
              const value = input.trim();
              if (['', 'false', 'null'].includes(value)) return null;
              let config;
              if (value === 'true') config = {};
              else if (value.startsWith('{') || value.startsWith('[')) config = JSON.parse(value);
              else config = {command: value};
              if (!config || typeof config !== 'object' || Array.isArray(config)) throw new Error(name + ' must be a command or JSON object.');
              const unknown = Object.keys(config).filter(key => !Object.hasOwn(defaults, key));
              if (unknown.length) throw new Error('Unknown ' + name + ' options: ' + unknown.join(', '));
              config = {...defaults, ...config};
              for (const [key, value] of Object.entries(config)) {
                if (Array.isArray(defaults[key]) ? !Array.isArray(value) : typeof value !== typeof defaults[key]) throw new Error(name + '.' + key + ' has the wrong type.');
              }
              return config;
            }
            const lint = options('lint', process.env.LINT, {command: '', 'lint-results': 'ruff.sarif'});
            const test = options('test', process.env.TEST, {command: '', coverage: true, 'test-results': 'junit.xml', 'test-coverage': 'coverage.xml'});
            let pkg;
            try { pkg = JSON.parse(process.env.PACKAGE.trim() || 'false'); }
            catch { throw new Error('package must be true, false or an object with tests.'); }
            if (typeof pkg !== 'boolean' && (!pkg || typeof pkg !== 'object' || Array.isArray(pkg))) throw new Error('package must be true, false or an object.');
            const enabled = pkg !== false;
            if (typeof pkg === 'boolean') pkg = {};
            if (Object.keys(pkg).some(key => key !== 'tests')) throw new Error('Unknown package option.');
            if (typeof (pkg.tests ?? '') !== 'string' || pkg.tests === null) throw new Error('package.tests must be a string.');
            core.setOutput('package-enabled', enabled);
            core.setOutput('package-tests', pkg.tests || '');
            core.setOutput('versions', versions);
            if (versions.length > 1 && versions.includes('')) throw new Error('Project detection cannot be mixed with explicit versions.');
            const primary = [...versions].sort((a, b) => {
              const left = a.split('.').map(Number); const right = b.split('.').map(Number);
              for (let index = 0; index < 3; index++) {
                const difference = (left[index] || 0) - (right[index] || 0);
                if (difference) return difference;
              }
              return 0;
            }).at(-1);
            core.setOutput('primary-version', primary);
            core.setOutput('lint', JSON.stringify(lint));
            core.setOutput('test', JSON.stringify(test));
  dependency-review:
    if: inputs.checks && inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - &id001
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
  lint:
    if: inputs.checks && needs.configuration.outputs.lint != 'null'
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - *id001
      - &id002
        uses: $/actions/setup-python
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ needs.configuration.outputs.primary-version }}
          uv-version: ${{ inputs.uv-version }}
      - uses: $/actions/lint
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ fromJSON(needs.configuration.outputs.lint).command }}
          lint-results: ${{ fromJSON(needs.configuration.outputs.lint).lint-results }}
  test:
    if: inputs.checks && needs.configuration.outputs.test != 'null'
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: $/actions/setup-python
        with:
          working-directory: ${{ inputs.working-directory }}
          python-version: ${{ matrix.version }}
          uv-version: ${{ inputs.uv-version }}
      - uses: $/actions/test
        with:
          working-directory: ${{ inputs.working-directory }}
          command: ${{ fromJSON(needs.configuration.outputs.test).command }}
          coverage:
            ${{ matrix.version == needs.configuration.outputs.primary-version && fromJSON(needs.configuration.outputs.test).coverage && 'true' ||
            'false' }}
          test-results: ${{ fromJSON(needs.configuration.outputs.test).test-results }}
          test-coverage: ${{ fromJSON(needs.configuration.outputs.test).test-coverage }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.configuration.outputs.versions) }}
  audit:
    if: inputs.checks && inputs.audit
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *id001
      - *id002
      - uses: $/actions/audit
        with:
          working-directory: ${{ inputs.working-directory }}
  package:
    if: inputs.checks && needs.configuration.outputs.package-enabled == 'true'
    needs: configuration
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - *id001
      - *id002
      - uses: $/actions/package/test
        with:
          working-directory: ${{ inputs.working-directory }}
          commands: ${{ needs.configuration.outputs.package-tests }}
