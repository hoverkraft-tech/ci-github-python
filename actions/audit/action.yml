---
name: Audit Python
description: |
  Audit locked production dependencies with pip-audit.

  The action exports the selected environment from `uv.lock` with hashes and
  audits it with `pip-audit --require-hashes --disable-pip`. Development groups
  and the project itself are excluded. Registry dependencies with hashes are
  supported; direct VCS or editable dependencies may require a project-specific
  audit workflow. Vulnerability lookup requires network access and scanner failures
  fail the action. Dependency metadata is not rewritten.

  <!-- jscpd:ignore-start -->
  <!-- Shared setup and reporting guidance for standalone actions. -->

  Run [setup-python](../setup-python/README.md) first with the same `working-directory`.

  See the [continuous integration workflow](../../.github/workflows/continuous-integration.md) for orchestration and version matrices.

  <!-- jscpd:ignore-end -->
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: uv project directory.
    default: .
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: audit
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        PIP_AUDIT_VERSION: 2.10.1
      run: |
        requirements=$(mktemp "$RUNNER_TEMP/python-audit.XXXXXX")
        trap 'rm -f "$requirements"' EXIT
        uv export --locked --no-default-groups --no-emit-project --format=requirements-txt --output-file="$requirements"
        uvx --from "pip-audit==$PIP_AUDIT_VERSION" pip-audit --require-hashes --disable-pip --requirement "$requirements"
