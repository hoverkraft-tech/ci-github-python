---
name: Lint Python
description: |
  Run project-locked Ruff, Black and mypy.

  Declare all three in the default uv dependency groups and configure them in
  `pyproject.toml`. Ruff emits SARIF, Black checks formatting and mypy checks types.
  All three execute even after one fails. A trusted Bash `command` replaces defaults;
  emit SARIF or Checkstyle to retain annotations from custom checks.

  <!-- jscpd:ignore-start -->
  <!-- Shared setup and reporting guidance for standalone actions. -->

  Run [setup-python](../setup-python/README.md) first with the same `working-directory`.

  Native reports survive command failures and are retained for seven days.
  See the [continuous integration workflow](../../.github/workflows/continuous-integration.md#reports-and-permissions) for consolidated reporting and permissions.

  <!-- jscpd:ignore-end -->
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: uv project directory.
    default: .
  command:
    description: Trusted Bash command replacing the default checks. Generate SARIF or Checkstyle reports for annotations.
    default: ""
  report-plan:
    description: Expected producer metadata supplied by reusable workflows. Leave empty for a standalone invocation.
    default: ""
outputs:
  report-plan:
    description: Expected lint report metadata. Forward from standalone jobs.
    value: ${{ steps.report-plan.outputs.report-plan }}
  report-artifact-id:
    description: Native lint report bundle.
    value: ${{ steps.reports.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"lint","type":"lint","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":[]}]'
    - id: run
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        COMMAND: ${{ inputs.command }}
        CI: "true"
      run: |
        if [ -n "$COMMAND" ] && ! [[ "$COMMAND" =~ [^[:space:]] ]]; then
          echo "command must not contain only whitespace." >&2
          exit 1
        fi
        if [ -n "$COMMAND" ]; then
          bash --noprofile --norc -e -u -o pipefail -c "$COMMAND"
          exit
        fi
        status=0
        uv run --locked ruff check --output-format=sarif --output-file=ruff.sarif . || status=1
        uv run --locked black --check . || status=1
        uv run --locked mypy . || status=1
        exit "$status"
    - id: reports
      name: Record lint results
      if: ${{ !cancelled() && steps.run.outcome != 'skipped' && steps.report-plan.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: auto:lint
