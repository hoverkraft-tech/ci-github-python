name: Setup Python
# Usage is self-contained in every generated action readme.
# jscpd:ignore-start
description: |
  Install Python and uv, cache downloads and synchronize locked dependencies.

  Use a uv project with committed `pyproject.toml`, `uv.lock` and preferably
  `.python-version`. Explicit `python-version` takes precedence; otherwise uv
  selects from `.python-version` and `requires-python`.

  Setup runs `uv sync --locked`: missing or stale locks fail instead of being
  rewritten. It installs uv's default dependency groups; optional extras require
  caller configuration. Configure `[tool.uv].default-groups` for additional groups.
  Declare Ruff, Black, mypy, pytest and pytest-cov in these groups to use the default
  lint and test actions. The [fixture](../../tests/python-project/pyproject.toml)
  shows a typed `src/` package with project-owned tool configuration.

  Set `install-dependencies: "false"` for runtime-only jobs or caller-managed
  dependencies; `pyproject.toml` is still required. Working directories must stay
  inside the checkout. Build backends execute code during installation; Python
  has no general equivalent to npm's `ignore-scripts` switch.

  ### Standalone setup

  Check out the project before setup. Use a Linux runner supporting Node.js 24
  actions and pin all actions from this repository to the same reviewed commit.
  Later lint, test and audit actions reuse this environment.

  ```yaml
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: hoverkraft-tech/ci-github-python/actions/setup-python@main
      with:
        working-directory: .
  ```

  See the [continuous integration workflow](../../.github/workflows/continuous-integration.md) for orchestration and version matrices.
# jscpd:ignore-end
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: uv project directory inside the checkout.
    default: .
  python-version:
    description: Explicit Python version. Empty uses the project's .python-version or requires-python.
    default: ""
  uv-version:
    description: Pinned uv release.
    default: 0.13.9
  install-dependencies:
    description: Synchronize locked dependencies and the project. Disable for tooling-only jobs.
    default: "true"
outputs:
  uv-version:
    description: Installed uv version.
    value: ${{ steps.uv.outputs.uv-version }}
runs:
  using: composite
  steps:
    # Shared working-directory validation, kept at each standalone entry point.
    # jscpd:ignore-start
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97
      with:
        working-directory: ${{ inputs.working-directory }}
    # jscpd:ignore-end
    - id: validate
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
      run: |
        case "$INSTALL_DEPENDENCIES" in true|false) ;; *) echo 'install-dependencies must be true or false.' >&2; exit 1 ;; esac
        test -f pyproject.toml || { echo 'Missing pyproject.toml.' >&2; exit 1; }
        if [ "$INSTALL_DEPENDENCIES" = true ]; then
          test -f uv.lock || { echo 'Commit uv.lock before running CI.' >&2; exit 1; }
        fi
    - id: uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        enable-cache: ${{ inputs.install-dependencies }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          .python-version
    - id: python
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      run: |
        uv python install
    - id: install
      shell: bash
      if: inputs.install-dependencies == 'true'
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      run: |
        uv sync --locked
