---
name: Test Python
description: |
  Run Python tests and retain native test and coverage reports.

  Use the matching setup action first. Commands must generate JUnit reports.
  Coverage collection requires Cobertura XML. The test command controls instrumentation.

  Forward report-plan from standalone jobs, or use the reusable CI workflow, which
  exposes the complete expected plan automatically. Choose external coverage
  publication once in the common ci-reports workflow. This action posts no comments
  and needs no publication permissions. Available reports survive test failures.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: uv project directory.
    default: .
  command:
    description: Trusted Bash test command. Configure measured packages in [tool.coverage.run]. Generate junit.xml and cobertura.xml for reporting.
    default: uv run --locked pytest --junitxml=junit.xml --cov --cov-report=term-missing --cov-report=xml:cobertura.xml
  coverage-reports:
    description: |-
      Optional JSON array of Cobertura file, language and label. Empty uses cobertura.xml and the project directory as its stable label.
    default: ""
  coverage:
    description: Require and collect Cobertura coverage. Set false to retain only available native diagnostics. Instrumentation is controlled by the test command.
    default: "true"
  report-plan:
    description: Expected producer metadata supplied by reusable workflows. Leave empty for a standalone invocation.
    default: ""
outputs:
  report-plan:
    description: Expected report metadata. Forward from standalone jobs.
    value: ${{ steps.report-plan.outputs.report-plan }}
  report-artifact-id:
    description: Native report bundle, including available diagnostics after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: validate
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
      run: |
        case "$COVERAGE" in true|false) ;; *) echo 'coverage must be true or false.' >&2; exit 1 ;; esac
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"test","type":"test","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":${{ inputs.coverage == ''true'' && (inputs.coverage-reports || ''[{"file":"cobertura.xml","language":"Python"}]'') || ''[]'' }}}]'
    - id: run
      shell: bash
      working-directory: ${{ steps.directory.outputs.absolute-path }}
      env:
        COMMAND: ${{ inputs.command }}
        CI: "true"
      run: |
        test -n "$COMMAND" || { echo "command must not be empty." >&2; exit 1; }
        if [ -n "$COMMAND" ] && ! [[ "$COMMAND" =~ [^[:space:]] ]]; then
          echo "command must not contain only whitespace." >&2
          exit 1
        fi
        bash --noprofile --norc -e -u -o pipefail -c "$COMMAND"
    - name: Record test results
      id: reports
      if: ${{ !cancelled() && steps.run.outcome != 'skipped' && steps.report-plan.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: auto:test
